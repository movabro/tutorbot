tags_any = ["work", "업무"] # 적힌 꼬리표 중 하나 이상이 있는 항목을 고름
time = "created_last_24h" # 실행 직전 24시간에 새로 만든 기록만 고름

# 위의 업무 기록과 함께 모을 공부 기록
# career-daily 작업의 selection(피드백 대상 선택) 설정
[[feedback_rules.tasks.selection]]
file_id = "<study file ID>" # 학습 문서에서
parent_node_id = "<학습 기록 node ID>" # 학습 기록 아래를 살펴봄
scope = "descendants" # 기록 묶음 자체를 빼고 그 아래 항목들을 봄
tags_any = ["공부", "study"] # 적힌 꼬리표 중 하나 이상이 있는 항목을 고름
time = "created_last_24h" # 실행 직전 24시간에 새로 만든 기록만 고름

# 위의 기록들과 함께 모을 일상 기록
