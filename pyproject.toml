[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tutorbot"
version = "0.1.0"
description = "Personal tutor bot driven by Dynalist"
requires-python = ">=3.10"
dependencies = [
  "httpx",
  "pydantic>=2",
  "tomli; python_version<'3.11'",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tutorbot = "tutorbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tutorbot = ["db/*.sql", "db/migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
