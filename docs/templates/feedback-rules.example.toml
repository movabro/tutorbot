# 미구현 설계 초안: 모든 필드와 동작은 제안이며 현재 실행되지 않음.
# - config.toml에 복사해도 동작하지 않으며 [domains.*]에 넣으면 검증 오류가 날 수 있음.
# - 현재 로더, TOML 폴백 파서 및 스케줄러는 이 형식을 지원하지 않음.
#
# 용어와 설정 읽는 법
# - 피드백(feedback)은 이 파일의 설정에 따라 만들어지는 평가나 설명임.
# - 피드백 작업(feedback task)은 어떤 내용을 살펴보고 어디에 결과를 쓸지 정한 한 묶음임.
# - 피드백 작업(feedback task)은 목적, 피드백 대상 선택(selection), 참조(references), 출력(output), 처리(processing)를 담는 설정 단위임.
# - 결과 문서는 피드백을 써 넣을 문서임. selection이 읽는 소스 문서와 같을 수도, 다를 수도 있음.
# - 피드백 대상 노드(항목)는 selection으로 고르는 분석 단위임.
# - 부모 항목(노드)은 selection 또는 references의 parent_node_id로 지정하며, 그 설정이 읽거나 고를 항목들의 출발점이 되는 항목임.
#   output.parent_node_id는 이와 다르게 피드백 결과를 직접 자식 노드로 추가할 부모 항목임.
# - 참조 문서/노드는 references로 읽는 추가 참고 자료이며 피드백 대상으로 선택하지 않음.
# - <...>는 실제 문서나 항목의 번호로 바꿔 쓸 자리임.
#
# 작성자는 아래처럼 [[feedback_rules.tasks]]에서 작업 하나의 설정을 시작함.
# 그 설정 선언 뒤에 적는 id와 purpose는 방금 시작한 작업의 이름과 목적임. 이는 파일의 줄 순서이지 노드 계층이 아님.
# 이어지는 [[feedback_rules.tasks.selection]]은 피드백 받을 항목을 고르는 곳임.
# [[feedback_rules.tasks.references]]는 피드백을 쓸 때 참고로 함께 읽을 자료를 정함.
# [feedback_rules.tasks.output]은 완성한 피드백을 둘 곳을 정함.
# selection, references, output 설정은 바로 앞에 적은 [[feedback_rules.tasks]] 작업에 속함. 새 작업은 [[feedback_rules.tasks]]부터 다시 적음.
# 예: 아래의 study-goals 작업은 selection으로 목표를 고르고,
# references로 공부 기록을 참고한 뒤, output에서 정한 위치에 피드백을 씀.
#
# 설정 항목 안내
# 아래 값들은 초안의 제안이나 예시이며, 전체 허용목록과 추가 옵션은 아직 확정되지 않음.
# - id: 작업을 구별하는 이름을 직접 적음. 예: "study-goals". 이름 형식과 고유성 규칙은 미정임.
# - purpose: 피드백 작업의 목적을 자유롭게 적음. 예: "신규 학습 기록마다 오류 교정과 다음 학습 제안".
# - domain: 작업의 분야를 나타내는 분류임. 예: "study"(학습), "career"(진로).
#   domain 은 사용자가 필요에 의해 계속 추가할 수 있음. domain 값이 읽을 문서나 결과를 쓸 문서를 정하지는 않음.
#   예시 : study(학습), career(진로), work(업무), life(일상). 
# - persona_path: 피드백 작성 역할이 적힌 페르소나 파일의 경로를 직접 적음.
#   이 설정 파일이 있는 디렉터리를 시작점으로 하는 상대 경로로 제안하며 예: "docs/templates/personas/study.md".
# - persona_approval: 페르소나를 쓰기 전에 사용자 승인을 받을지 정하는 정책임.
#   정책 값 목록은 아래와 같음.
#   - "user_approved_before_use": 페르소나를 쓰기 전에 사용자 승인을 받음.
#   - "always_allowed": 승인 없이 페르소나를 바로 사용함.
#   - "approve_each_run" : 실행할 때마다 사용자 승인을 받은 뒤 페르소나를 사용함.
# - unit: 피드백을 몇 개 만들지 정하는 단위임. "per_node"는 고른 항목마다 피드백 하나씩,
#   "aggregate"는 고른 항목들을 모아 피드백 하나를 만듦.
# - schedule: 피드백 작업 실행 주기.
#   - "each_run": 실행할 때마다 매번 수행
#   - "daily": 지정된 timezone 기준 하루 최대 1회 실행 (사용자가 실행 시각 지정 : 하루중 몇 시에 실행할지, default 값: 자정)
#   - "weekly": 지정된 timezone 기준 주당 최대 1회 실행 (주는 월요일에 시작해 일요일에 끝남. 사용자가 실행 요일 및 시간 지정 : 월~일 중에 몇요일, 몇시에 실행할지, default 값 : 일요일(그 주의 마지막 날), 자정)
#   - "monthly": 지정된 timezone 기준 월당 최대 1회 실행 (사용자가 실행 일 및 시간 지정 : 매월 몇일, 몇시에 실행할지, default 값 : 매월 말일, 자정)
#   - "quarterly": 지정된 timezone 기준 분기당 최대 1회 실행 (기본: 분기 말일인 3/31, 6/30, 9/30, 12/31 00:00.
#     schedule_quarter_anchor = "start"를 적으면 분기 시작일인 1/1, 4/1, 7/1, 10/1 00:00)
#   - "yearly": 지정된 timezone 기준 연간 최대 1회 실행 (사용자가 실행일 지정 : 1년중 몇월 몇일 몇시에 실행할지, default 값 : 매년 12월 31일, 자정)
# - 주기 필드는 schedule 문자열 옆의 같은 task에 두는 미구현 설계 제안임.
#   - schedule_time: daily/weekly/monthly/quarterly/yearly의 현지 실행 시간, 24시간제 "HH:MM" 문자열.
#     예: schedule_time = "09:30". 생략하면 "00:00". each_run에는 적용하지 않음.
#   - schedule_weekday: weekly의 요일, "monday" ~ "sunday" 문자열. 예: schedule_weekday = "monday".
#     생략하면 "sunday"(월요일에 시작하는 주의 마지막 날). 다른 주기에는 적용하지 않음.
#   - schedule_day: monthly/yearly의 일, 1~31 정수. 예: schedule_day = 15.
#     monthly에서 생략하면 말일이며, 지정일이 없는 달은 그 달 말일. yearly에서 생략하면 31.
#   - schedule_month: yearly의 월, 1~12 정수. 예: schedule_month = 6. 생략하면 12.
#     그 외 주기에는 적용하지 않음.
#     yearly의 지정일이 지정 월에 없으면(예: 2월 30일, 평년의 2월 29일) 에러 로그에 명시적으로 남김.
#     monthly는 지정일이 없는 달에 말일로 대체하지만 yearly는 대체하지 않고 에러 로그를 남기는 점이 다름.
#     에러 로그를 남기고 그 해의 실행을 건너뛰며 재시도하거나 보충하지 않음.
#   - schedule_quarter_anchor: quarterly의 기준일, "end"(분기 말일: 3/31, 6/30, 9/30, 12/31) 또는
#     "start"(분기 시작일: 1/1, 4/1, 7/1, 10/1) 문자열. 생략하면 "end". quarterly에만 적용함.
#     schedule_time은 quarterly에도 적용되며 생략하면 "00:00"이므로 두 기준 모두 기본은 그날 00:00임.
#     예: schedule = "quarterly", schedule_quarter_anchor = "start", schedule_time = "09:30".
#     허용되지 않은 값이면 에러 로그를 남기고 해당 작업을 실행하지 않으며 재시도하지 않음.
#   - 예: weekly에는 schedule = "weekly", schedule_weekday = "monday", schedule_time = "09:30".
#     monthly에는 schedule = "monthly", schedule_day = 31; yearly에는 schedule = "yearly",
#     schedule_month = 6, schedule_day = 15. 각 설정은 별도 task의 예시임.
#   - 주(week)는 월요일에 시작해 일요일에 끝남.
#   - 지정 시각이 지난 뒤 같은 주기 안에서 도구가 켜져도 그 주기에 실행 기록이 없으면 한 번 실행함.
#     이전 주기는 보충하지 않으며, 같은 주기에 실행 기록이 이미 있으면 실행하지 않음.
#   - 같은 작업이 이미 실행 중이면 새 실행을 시작하지 않고 로그에 남기며 재시도하지 않음.
#   - 적용 범위 밖 필드를 넣었을 때의 처리는 미결정임.
# - timezone: 주기별 현지 날짜와 실행 시각의 기준 시간대 제안. 예: "Asia/Seoul"(서울 시간).
# - input_token_range, output_token_range: LLM을 한 번 호출할 때 읽고 쓸 토큰 수의 목표를 숫자 두 개(최소, 최대)로 적음.
#   예: [1000, 4000], [200, 700]. 보장되는 한도나 비용 상한은 아님.
# - evidence: 피드백이 어떤 문서·항목을 근거로 했는지 어떻게 밝힐지 자유롭게 적는 지침임.
#   예: "기록, 목표 및 진도의 근거를 구분하고 부족한 정보는 명시". 근거가 맞는지 시스템이 검증해 준다는 보장은 없음.
# - selection: 피드백 대상으로 삼을 문서와 항목을 정함.
# - references: 피드백을 작성할 때 참고로 함께 읽을 자료를 정함. references만으로는 피드백 대상을 고르지 않음.
#   예를 들어 study-goals에서는 selection이 학습 목표를 고르고, references가 공부 기록을 참고 자료로 읽음.
#   피드백 결과는 output 설정에 따라 고른 목표마다 그 목표의 직접 자식 노드로 추가하는 안임.
#   같은 문서나 항목도 다른 selection 설정에서는 피드백 대상으로 선택되고, output 설정에서는 결과를 쓰는 위치가 될 수 있음.
# - selection과 references의 file_id: 읽을 실제 문서 번호를 적음. 예: "<study file ID>"는 자리표시자임.
# - selection과 references의 parent_node_id: 이 selection(또는 references)이 읽거나 고를 항목들의 출발점이 되는 항목(부모 항목)의 실제 번호를 적음.
#   scope 값에 따라 이 부모 항목 자체, 그 아래 항목, 또는 둘 다를 읽음.
#   예: "<목표 목록 node ID>"는 자리표시자임.
# - selection과 references의 scope: parent_node_id로 지정한 부모 항목에서 어디까지 읽거나 고를지 정함.
#   "self"는 부모 항목 자체만, "descendants"는 부모 항목 아래의 모든 하위 항목(자손)만,
#   "self_and_descendants"는 부모 항목 자체와 그 자손 모두임.
# - selection의 context_scope: selection이 고른 피드백 대상 항목 하나를 평가할 때, 그 항목과 함께 읽을 내용의 범위임.
#   현재 예시 "self_excluding_nested_goal_subtrees"는 고른 목표 항목 자신과 그 내용을 읽되,
#   그 목표 안에 들어 있는 다른 목표 항목과 그 아래 내용은 뺌.
#   context_scope의 선택 항목은 아래와 같음.
#   - "self" : 고른 항목 자신만 읽음.
#   - "self_and_descendants" : 고른 항목과 그 아래 자식·손자 등 모든 하위 항목을 모두 읽음.
#   - "self_and_children" : 고른 항목과 바로 아래 자식 항목만 읽음(손자 이하는 제외).
#   - "self_excluding_nested_goal_subtrees" (기존 예시 값, 유지): 고른 목표 자신과 내용을 읽되 그 안의 다른 목표와 그 아래 내용은 뺌.
# - selection과 references의 tags_any: 항목을 고르는 조건으로 쓸 꼬리표(태그) 이름을 목록으로 직접 적음.
#   Dynalist 노드 본문 또는 노트에 적힌 "#text" 형태에서 "#"을 제외한 text 부분이 태그이며, tags_any에는 이 text 부분만 적음.
#   예: 본문에 "#목표"가 있으면 태그는 "목표"이며 ["목표", "goal"]은 항목에 둘 중 하나 이상이 붙어 있으면 고름. []는 태그 조건을 쓰지 않음.
# - selection과 references의 time: 항목을 선택하는 시간 조건.
#   - "fixed_context": 생성 시점과 무관하게 모든 항목의 현재 내용을 읽음
#   - "created_last_24h": 실행 직전 24시간 이내에 생성된 항목만 선택
#   - "created_today": 지정된 timezone 기준 오늘(00:00 ~ 현재) 생성된 항목만 선택
#   - "created_last_7d" : 실행 직전 7일 안에 생성된 항목만 선택.
#   - "created_since_last_run": 성공·실패와 관계없이 직전 실행 이후에 생성된 항목만 선택
#   - "modified_today": 지정된 timezone 기준 오늘(00:00 ~ 현재) 수정된 항목만 선택
#   - "modified_last_24h" : 실행 직전 24시간 안에 수정된 항목만 선택. 생성 시각과 무관함.
#   - "modified_last_7d" : 실행 직전 7일 안에 수정된 항목만 선택.
#   - "modified_since_last_run": 성공·실패와 관계없이 직전 실행 이후에 수정된 항목만 선택
#   - created_since_last_run, modified_since_last_run은 건너뛴 실행도 직전 실행으로 기록함.
#     첫 실행 시각을 T라 할 때 daily은 24시간 전, weekly는 7일 전, monthly는 현지 달력의 한 달 전,
#     quarterly는 세 달 전, yearly는 한 해 전부터 T 미만까지 읽음. 옮긴 달에 같은 날짜가 없으면
#     그 달 말일을 하한으로 씀. 이 말일 대체는 첫 실행 조회 하한에만 적용하며 yearly 지정일 없음에
#     따른 실행 건너뛰기 규칙은 바꾸지 않음. each_run은 주기 기간이 없어 첫 실행 하한이 미결정임.
# - output: 피드백 결과를 쓸 위치를 정함.
# - output.file_id, output.parent_node_id: 피드백 결과를 쓸 실제 문서 번호와, 결과를 직접 자식 노드로 추가할 부모 항목의 실제 번호를 적음.
#   (selection과 references의 parent_node_id와 달리 읽을 항목이 아니라 결과를 놓을 자리임.)
#   예: "<study file ID>", "<진도 종합 결과를 둘 node ID>"는 자리표시자임.
# - output.placement: 피드백 결과를 둘 위치의 제안임. "under_each_selected_node"는 고른 항목마다 그 항목의 직접 자식으로,
#   "under_parent"는 output.parent_node_id로 지정한 부모 항목의 직접 자식으로 피드백 하나를 추가함.
#   예시 (들여쓰기는 노드 계층):
#   지정 노드
#     피드백 결과   <- 지정 노드의 직접 자식
#   같은 단계 노드 <- 지정 노드의 형제, 자식이 아님
#   같은 단계의 뒤에 적는 노드는 형제이며, 형제 노드 출력 옵션은 이 초안에 없음.
#
# 피드백 대상 노드와 참조 관련 내용
# - 한 피드백 작업에 selection이 여러 개이면 각 selection이 고른 항목을 모두 합쳐(합집합) 피드백 대상으로 분석하고, references는 추가 참고 자료로만 사용함.
# - selection이 고른 항목이 하나도 없으면 references가 있어도 피드백 결과를 만들지 않는 안임.
# - context_scope 값 self_excluding_nested_goal_subtrees는 고른 목표 자신과 그 내용을 함께 읽되,
#   그 안에 중첩된 다른 목표의 하위 트리(그 목표와 그 아래 항목)는 제외함.
# - study-goals의 selection은 parent_node_id로 지정한 부모 항목의 자손 중 태그가 맞는 목표를 고르며, 하위 목표도 각각 별도로 평가함.
#
# scope와 태그 관련 내용
# - scope는 selection 또는 references가 parent_node_id로 지정한 부모 항목에서 어디까지 읽거나 고를지 정함.
#   self는 부모 항목 자체, descendants는 부모 항목의 자손, self_and_descendants는 둘 모두를 뜻함.
# - Dynalist 노드 본문 또는 노트의 "#text" 형태에서 "#"을 제외한 text 부분이 태그이며, tags_any의 이름(text 부분만 적음)과 비교함. []는 태그 제한 없음임.
# - 태그 조건과 시간 조건을 모두 만족해야 고르며(AND), 각 조건은 그 조건을 적은 selection 또는 references에만 적용함.
#   부모 항목에 붙은 태그나 시간 조건을 그 자손에게 상속하지 않음.
# - 태그 비교에서 text는 대소문자를 구분하지 않으며, 예: "Goal"과 "goal"은 같은 꼬리표로 봄.
#   태그 이름은 공백·쉼표·마침표를 경계로 하며 하이픈과 슬래시는 이름에 포함함.
#   예: "#goal,"와 "#goal."의 태그는 "goal", "#front-end"는 "front-end", "#work/life"는 "work/life"임.
# - 이 밖의 태그 문법과 파싱 일부 세부는 미정임.
#
# 신규 생성과 고정 문맥 관련 내용
# - created_last_24h는 신규 항목(노드)을 고르는 기본 시간 조건이며, 실행 직전 24시간 안에 생성된 항목을 뜻함.
# - created_last_24h의 시간 창은 항목의 생성 시각 created >= 실행시각 - 24시간, created < 실행시각임.
# - 항목을 마지막으로 고친 시각은 created_last_24h의 신규 생성 조건과 무관함.
# - fixed_context는 created_last_24h의 24시간 조건을 적용하지 않는 예외로, 오래된 항목도 현재 내용(스냅샷)으로 읽는 안임.
#
# 각 노드와 종합 출력 관련 내용
# - unit의 per_node는 고른 노드마다 피드백 하나를 그 노드의 직접 자식으로 추가하는 안임.
# - unit의 aggregate는 고른 노드 전체를 묶어, output.file_id 문서 안의 output.parent_node_id 부모 항목의 직접 자식으로 피드백 하나를 추가하는 안임.
# - output.placement의 under_each_selected_node는 per_node의 출력 위치(고른 노드 각각의 직접 자식)를,
#   under_parent는 aggregate의 출력 위치(output.parent_node_id 부모 항목의 직접 자식)를 뜻함.
# - unit과 placement 조합:
#   | unit | placement | 설명 |
#   |---|---|---|
#   | per_node | under_each_selected_node | 고른 노드마다 결과 하나를 그 노드의 직접 자식으로 추가함 |
#   | aggregate | under_parent | 고른 노드를 묶은 결과 하나를 부모 항목의 직접 자식으로 추가함 |
#   | per_node | under_parent | 여러 결과를 한 부모의 직접 자식으로 둠 |
#   | aggregate | under_each_selected_node | 결과 하나를 여러 선택 노드의 직접 자식으로 둠 |
#
# 시간대와 주기 관련 내용
# - schedule의 each_run은 매 실행을, daily/weekly/monthly/quarterly/yearly는 해당 현지 주기당 최대 한 번의 실행을 뜻함.
#   성공 여부가 아닌 실행 자체가 중복 제한 기준이며 실패 후 재시도하지 않고 놓친 실행도 보충하지 않음.
#   지정 시각이 지난 뒤 같은 주기 안에서 켜져 그 주기의 실행 기록이 없으면 한 번 실행함.
#   이전 주기는 보충하지 않으며 같은 주기에 기록이 있으면 실행하지 않음.
# - 같은 작업이 실행 중이면 새 실행을 시작하지 않고 로그만 남기며 재시도하지 않음.
# - 선택 결과 없음, 연간 지정일 없음, 잘못된 분기 기준값 등으로 작업을 건너뛴 평가도 실행 기록으로 남김.
#   그 시각은 created_since_last_run과 modified_since_last_run의 직전 실행 시각이 됨.
# - career-daily 작업은 timezone이 Asia/Seoul이며, 업무·학습·일상 세 selection 중 하나라도 항목을 골랐으면 종합함.
# - 세 selection이 고른 항목이 모두 없으면 career-daily 작업을 건너뛰며, 놓친 날짜를 나중에 자동으로 다시 실행하지 않는 안임.
# - 다음에 실제로 실행할 때는 그 실행 시점 기준의 24시간 창만 사용함.
# - 결과 쓰기 충돌, 원자적 쓰기 등 동시 실행 감지 외의 세부 처리는 미결정임.
#
# 페르소나 경로와 승인 관련 내용
# - persona_path는 향후 이 설정 파일이 있는 디렉터리를 시작점으로 하는 상대 경로로 제안함.
# - 이 파일의 persona_path 예시 경로는 설정 파일이 저장소 루트에 있다고 가정함.
# - persona_approval의 user_approved_before_use는 페르소나 사용 전 사용자 승인 정책이며 페르소나 추천과 승인 절차는 미구현임.
#
# 토큰과 근거 관련 내용
# - input_token_range와 output_token_range는 LLM을 한 번 호출할 때의 입력·출력 토큰 목표이며 보장이나 비용 상한이 아님.
# - 입력이나 출력이 토큰 목표를 넘을 때 내용을 나누거나 줄이는 방식은 미결정임.
# - evidence는 피드백의 근거를 LLM에 전달된 문서·노드와 연결하고, 부족하거나 잘린 내용은 그렇다고 밝히라는 지침임.
# - 이 초안은 근거 출처를 시스템이 검증하는 기능의 구현을 약속하지 않음.
#
# 작성 시 주의사항 관련 내용
# - 설정 작성자는 실제로 존재하는 문서·노드 ID, 문서 접근 권한, selection이 고르는 항목의 범위와 output의 결과 위치를 직접 확인해야 함.
# - 특히 학습·커리어 등 이 파일의 문서·노드 ID는 자리표시자이므로 이 파일을 그대로 실제 서비스 설정에 넣으면 안 됨.
# - 설정 작성자는 비밀 값과 실명 등 민감한 내용을 설정에 넣지 않아야 함.

# 꺾쇠로 둘러싼 부분은 빈자리이므로 실제 문서와 항목의 번호로 바꿔야 함.
# input_token_range와 output_token_range의 숫자는 토큰(글을 세는 단위) 목표 범위이며 꼭 지켜지는 한도는 아님.

# 학습 목표별 피드백 작업(feedback task)
[[feedback_rules.tasks]]
id = "study-goals" # 이 피드백 작업을 구별하는 이름
purpose = "각 학습 목표에 대해 지식 평가, 누락과 다음 학습을 제안" # 목표를 살피고 다음 공부를 알려 줌
domain = "study" # 학습에 관한 작업
persona_path = "docs/templates/personas/study.md" # 이 설정 파일이 있는 디렉터리에서 시작해 페르소나(피드백 작성 역할) 파일을 찾음
persona_approval = "user_approved_before_use" # 페르소나를 쓰기 전에 사용자 승인이 필요하지만 추천과 승인 절차는 아직 없음
unit = "per_node" # 고른 목표마다 따로 피드백을 만듦
schedule = "each_run" # 실행할 때마다 살펴봄
input_token_range = [1000, 4000] # LLM 한 번 호출에서 읽을 글은 1000~4000 토큰이 목표
output_token_range = [200, 700] # LLM 한 번 호출에서 쓸 답은 200~700 토큰이 목표
evidence = "전달된 목표와 기록의 문서/노드 ID를 근거로 제시; 없거나 잘린 내용은 모름으로 표시" # 어디서 알았는지 밝히고 모르는 내용도 알림

# 피드백할 목표를 고를 곳
# study-goals 작업의 selection(피드백 대상 선택) 설정
[[feedback_rules.tasks.selection]]
file_id = "<study file ID>" # 읽을 문서: 학습 문서
parent_node_id = "<목표 목록 node ID>" # 부모 항목: 이 아래에서 피드백할 목표를 고름
scope = "descendants" # 부모 항목(목표 목록) 자체는 빼고 그 아래 항목들만 고름
context_scope = "self_excluding_nested_goal_subtrees" # 고른 목표와 그 내용을 읽되 그 목표 안의 다른 목표와 그 아래 내용은 뺌
tags_any = ["목표", "goal"] # 항목에 이 꼬리표 중 하나 이상이 붙어 있어야 고름
time = "fixed_context" # 오래전에 만든 목표도 현재 모습으로 고름

# 피드백할 때 함께 읽을 공부 기록
# study-goals 작업의 references(참조) 설정
[[feedback_rules.tasks.references]]
file_id = "<study file ID>" # 읽을 문서: 학습 문서
parent_node_id = "<공부 기록 node ID>" # 부모 항목: 이 아래에서 참고할 공부 기록을 읽음
scope = "descendants" # 부모 항목(공부 기록 묶음) 자체는 빼고 그 아래 항목들만 읽음
tags_any = ["공부", "study"] # 항목에 이 꼬리표 중 하나 이상이 붙어 있어야 읽음
time = "created_last_24h" # 실행 직전 24시간에 새로 만든 기록만 읽음

# 고른 목표마다 직접 자식 노드로 피드백(feedback)을 추가하는 안
# study-goals 작업의 output(출력) 설정
[feedback_rules.tasks.output]
placement = "under_each_selected_node" # 고른 각 목표의 직접 자식으로 피드백을 하나씩 추가

# 새 공부 기록별 피드백 작업(feedback task)
[[feedback_rules.tasks]]
id = "study-new-records" # 이 피드백 작업을 구별하는 이름
purpose = "신규 학습 기록마다 오류 교정과 다음 학습 제안" # 잘못된 점과 다음 공부를 알려 줌
domain = "study" # 학습에 관한 작업
persona_path = "docs/templates/personas/study.md" # 이 설정 파일이 있는 디렉터리에서 시작해 페르소나(피드백 작성 역할) 파일을 찾음
persona_approval = "user_approved_before_use" # 페르소나를 쓰기 전에 사용자 승인이 필요하지만 추천과 승인 절차는 아직 없음
unit = "per_node" # 고른 기록마다 따로 피드백을 만듦
schedule = "each_run" # 실행할 때마다 살펴봄
input_token_range = [1000, 4000] # LLM 한 번 호출에서 읽을 글은 1000~4000 토큰이 목표
output_token_range = [200, 700] # LLM 한 번 호출에서 쓸 답은 200~700 토큰이 목표
evidence = "신규 기록, 관련 목표와 현재 진도의 문서/노드 ID를 제시하고 추측은 구분" # 어디서 알았는지 밝히고 추측은 따로 표시함

# 피드백할 새 공부 기록을 고를 곳
# study-new-records 작업의 selection(피드백 대상 선택) 설정
[[feedback_rules.tasks.selection]]
file_id = "<study file ID>" # 읽을 문서: 학습 문서
parent_node_id = "<공부 기록 node ID>" # 부모 항목: 이 아래에서 피드백할 공부 기록을 고름
scope = "descendants" # 부모 항목(공부 기록 묶음) 자체는 빼고 그 아래 항목들만 고름
tags_any = ["공부", "study"] # 항목에 이 꼬리표 중 하나 이상이 붙어 있어야 고름
time = "created_last_24h" # 실행 직전 24시간에 새로 만든 기록만 고름

# 기록을 이해할 때 함께 읽을 목표
# study-new-records 작업의 references(참조) 설정
[[feedback_rules.tasks.references]]
file_id = "<study file ID>" # 읽을 문서: 학습 문서
parent_node_id = "<해당 목표 node ID>" # 부모 항목: 작성자가 기록에 맞는 목표를 직접 지정함
scope = "self" # 부모 항목(지정한 목표) 자체만 읽음
tags_any = [] # 꼬리표 조건 없이 읽음
time = "fixed_context" # 오래된 목표도 현재 모습으로 읽음

# 기록을 이해할 때 함께 읽을 현재 진도
# study-new-records 작업의 references(참조) 설정
[[feedback_rules.tasks.references]]
file_id = "<study file ID>" # 읽을 문서: 학습 문서
parent_node_id = "<현재 진도 node ID>" # 부모 항목: 작성자가 기록과 목표에 맞는 진도를 직접 지정함
scope = "self_and_descendants" # 부모 항목(지정한 진도)과 그 아래 항목들을 함께 읽음
tags_any = [] # 꼬리표 조건 없이 읽음
time = "fixed_context" # 오래된 진도도 현재 모습으로 읽음

# 고른 기록마다 직접 자식 노드로 피드백(feedback)을 추가하는 안
# study-new-records 작업의 output(출력) 설정
[feedback_rules.tasks.output]
placement = "under_each_selected_node" # 고른 각 기록의 직접 자식으로 피드백을 하나씩 추가

# 새 기록들을 한데 모아 진도를 살피는 피드백 작업(feedback task)
[[feedback_rules.tasks]]
id = "study-progress" # 이 피드백 작업을 구별하는 이름
purpose = "신규 학습 기록을 목표와 현재 진도에 비추어 종합" # 목표와 진도를 보며 새 기록들을 종합함
domain = "study" # 학습에 관한 작업
persona_path = "docs/templates/personas/study.md" # 이 설정 파일이 있는 디렉터리에서 시작해 페르소나(피드백 작성 역할) 파일을 찾음
persona_approval = "user_approved_before_use" # 페르소나를 쓰기 전에 사용자 승인이 필요하지만 추천과 승인 절차는 아직 없음
unit = "aggregate" # 고른 기록들을 묶어 피드백(feedback)을 하나 만듦
schedule = "each_run" # 실행할 때마다 살펴봄
input_token_range = [1500, 5000] # LLM 한 번 호출에서 읽을 글은 1500~5000 토큰이 목표
output_token_range = [300, 900] # LLM 한 번 호출에서 쓸 답은 300~900 토큰이 목표
evidence = "기록, 목표 및 진도의 근거를 구분하고 부족한 정보는 명시" # 어디서 알았는지 구분하고 부족한 내용도 알림

# 종합할 새 공부 기록을 고를 곳
# study-progress 작업의 selection(피드백 대상 선택) 설정
[[feedback_rules.tasks.selection]]
file_id = "<study file ID>" # 읽을 문서: 학습 문서
parent_node_id = "<공부 기록 node ID>" # 부모 항목: 이 아래에서 종합할 공부 기록을 고름
scope = "descendants" # 부모 항목(공부 기록 묶음) 자체는 빼고 그 아래 항목들만 고름
tags_any = ["공부", "study"] # 항목에 이 꼬리표 중 하나 이상이 붙어 있어야 고름
time = "created_last_24h" # 실행 직전 24시간에 새로 만든 기록만 고름

# 종합할 때 함께 읽을 목표
# study-progress 작업의 references(참조) 설정
[[feedback_rules.tasks.references]]
file_id = "<study file ID>" # 읽을 문서: 학습 문서
parent_node_id = "<해당 목표 node ID>" # 부모 항목: 작성자가 기록에 맞는 목표를 직접 지정함
scope = "self" # 부모 항목(지정한 목표) 자체만 읽음
tags_any = [] # 꼬리표 조건 없이 읽음
time = "fixed_context" # 오래된 목표도 현재 모습으로 읽음

# 종합할 때 함께 읽을 현재 진도
# study-progress 작업의 references(참조) 설정
[[feedback_rules.tasks.references]]
file_id = "<study file ID>" # 읽을 문서: 학습 문서
parent_node_id = "<현재 진도 node ID>" # 부모 항목: 작성자가 기록과 목표에 맞는 진도를 직접 지정함
scope = "self_and_descendants" # 부모 항목(지정한 진도)과 그 아래 항목들을 함께 읽음
tags_any = [] # 꼬리표 조건 없이 읽음
time = "fixed_context" # 오래된 진도도 현재 모습으로 읽음

# 종합 피드백(feedback)을 둘 곳
# study-progress 작업의 output(출력) 설정
[feedback_rules.tasks.output]
file_id = "<study file ID>" # 피드백을 쓸 문서: 학습 문서
parent_node_id = "<진도 종합 결과를 둘 node ID>" # 부모 항목: 피드백을 이 항목의 직접 자식으로 추가
placement = "under_parent" # 지정한 부모 항목의 직접 자식으로 피드백 하나를 추가

# 일과 공부와 일상을 모아 진로를 살피는 작업: 아직 실행되지 않는 예시임
[[feedback_rules.tasks]]
id = "career-daily" # 이 피드백 작업을 구별하는 이름
purpose = "업무·학습·일상의 관찰을 커리어 목표와 비교해 일일 종합" # 모은 기록을 진로 목표와 비교함
domain = "career" # 진로에 관한 작업
persona_path = "docs/templates/personas/career.md" # 이 설정 파일이 있는 디렉터리에서 시작해 페르소나(피드백 작성 역할) 파일을 찾음
persona_approval = "user_approved_before_use" # 페르소나를 쓰기 전에 사용자 승인이 필요하지만 추천과 승인 절차는 아직 없음
unit = "aggregate" # 고른 기록들을 묶어 피드백(feedback)을 하나 만듦
schedule = "daily" # timezone에 적은 지역의 날짜 하루에 실행 자체는 최대 한 번
schedule_time = "00:00" # 미구현 실행 시각 예시; 생략해도 자정
timezone = "Asia/Seoul" # 서울의 날짜를 하루의 기준으로 삼음
input_token_range = [2000, 8000] # LLM 한 번 호출에서 읽을 글은 2000~8000 토큰이 목표
output_token_range = [400, 1200] # LLM 한 번 호출에서 쓸 답은 400~1200 토큰이 목표
evidence = "각 관찰의 문서/노드 ID와 목표를 연결하고 가설과 근거 부족을 별도 표시" # 기록과 목표를 연결하고 추측과 부족한 근거를 따로 알림

# 일일 종합 피드백 작업 관련 내용
# - career-daily 작업에서 selection이 읽는 소스 문서는 업무·학습·일상 문서이며, 결과를 쓰는 output 문서는 career 문서임.
# - career-daily 작업은 업무·학습·일상 세 selection이 고른 신규 항목을 합집합으로 묶음.
# - 세 selection 중 하나라도 항목을 골랐으면 career-daily 작업이 종합하고, 모두 고르지 못했으면 작업을 건너뜀.
# career-daily 작업의 selection(피드백 대상 선택) 설정: 업무 기록
[[feedback_rules.tasks.selection]]
file_id = "<work file ID>" # 읽을 문서: 일한 내용을 적은 업무 문서
parent_node_id = "<업무 기록 node ID>" # 부모 항목: 이 아래에서 업무 기록을 고름
scope = "descendants" # 부모 항목(업무 기록 묶음) 자체는 빼고 그 아래 항목들만 고름
tags_any = ["work", "업무"] # 항목에 이 꼬리표 중 하나 이상이 붙어 있어야 고름
time = "created_last_24h" # 실행 직전 24시간에 새로 만든 기록만 고름

# 앞의 업무 기록 selection과 함께 모을 공부 기록
# career-daily 작업의 selection(피드백 대상 선택) 설정
[[feedback_rules.tasks.selection]]
file_id = "<study file ID>" # 읽을 문서: 학습 문서
parent_node_id = "<학습 기록 node ID>" # 부모 항목: 이 아래에서 공부 기록을 고름
scope = "descendants" # 부모 항목(학습 기록 묶음) 자체는 빼고 그 아래 항목들만 고름
tags_any = ["공부", "study"] # 항목에 이 꼬리표 중 하나 이상이 붙어 있어야 고름
time = "created_last_24h" # 실행 직전 24시간에 새로 만든 기록만 고름

# 앞의 업무·공부 기록 selection과 함께 모을 일상 기록
# career-daily 작업의 selection(피드백 대상 선택) 설정
[[feedback_rules.tasks.selection]]
file_id = "<life file ID>" # 읽을 문서: 일상 문서
parent_node_id = "<일상 기록 node ID>" # 부모 항목: 이 아래에서 일상 기록을 고름
scope = "descendants" # 부모 항목(일상 기록 묶음) 자체는 빼고 그 아래 항목들만 고름
tags_any = ["life", "일상"] # 항목에 이 꼬리표 중 하나 이상이 붙어 있어야 고름
time = "created_last_24h" # 실행 직전 24시간에 새로 만든 기록만 고름

# 종합할 때 함께 읽을 진로 목표
# career-daily 작업의 references(참조) 설정
[[feedback_rules.tasks.references]]
file_id = "<career file ID>" # 읽을 문서: 진로 문서(목표를 참고로 읽음)
parent_node_id = "<커리어 목표 node ID>" # 부모 항목: 진로 목표 항목
scope = "self_and_descendants" # 부모 항목(진로 목표)과 그 아래 항목들을 함께 읽음
tags_any = [] # 꼬리표 조건 없이 읽음
time = "fixed_context" # 새로 고른 기록과 관계없이 오래된 목표도 현재 모습으로 읽음

# 피드백 대상으로 고른 기록과 다른 문서(진로 문서)에 종합 피드백(feedback)을 둘 곳
# career-daily 작업의 output(출력) 설정
[feedback_rules.tasks.output]
file_id = "<career file ID>" # 피드백을 쓸 문서: 진로 문서
parent_node_id = "<커리어 일일 종합 결과를 둘 node ID>" # 부모 항목: 피드백을 이 항목의 직접 자식으로 추가
placement = "under_parent" # 지정한 부모 항목의 직접 자식으로 피드백 하나를 추가
